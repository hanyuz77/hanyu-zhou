<!DOCTYPE html>

  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <header class="site-header">
      <a href="#" class="logo" aria-label="Home">Hanyu Zhou</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="#work" class="nav-link">Work</a>
        <a href="#fun" class="nav-link">Fun</a>

    <main>
      <section class="hero" aria-label="Introduction">
        <div class="hero-inner">
          <div class="hero-vinyl" aria-hidden="true">

              <img
                src="assets/vinyl.png"
                alt=""

                width="560"
                height="560"
              />

              <a href="tencent-music.html" class="project-link"

            <div class="project-visual project-visual--report">
              <img
                src="assets/tme_title.png"
                alt="腾讯音乐实习项目界面示意"
                width="3840"
                height="2160"
